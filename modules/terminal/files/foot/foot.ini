[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0
# Which [colors-*] section new windows start in; the kit's theme hook sets it
# to light or dark with each theme.
initial-color-theme=dark

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# Setup kit: see-through terminals. A terminal's own alpha is drawn over
# Hyprland's blur (the kit's look turns blur on, with xray), so you see a
# blurred wallpaper behind the text, not the windows underneath.
# The alpha lines are set by ~/.config/omarchy/hooks/theme-set.d/zz-kit-foot-glass
# on each theme change (0.62 dark, 0.72 light, or the theme's own alpha):
# change DEFAULT_DARK / DEFAULT_LIGHT there, not here. 1.0 = solid.
[colors-dark]
alpha=0.62
# Every cell, not just ones on the default background, so the glass isn't patchy.
alpha-mode=all

[colors-light]
# A light theme loses contrast to the wallpaper sooner, so it gets less glass.
alpha=0.72
alpha-mode=all
