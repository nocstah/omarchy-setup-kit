# Helix, from the setup kit. The theme is the one Omarchy generates for the
# current theme (themes/omarchy.toml links to it), so Helix follows theme changes.
theme = "omarchy"

[editor]
line-number = "relative"
cursorline = true
bufferline = "multiple"
color-modes = true          # mode shows in the statusline colour
true-color = true
rulers = [100]
scrolloff = 6
popup-border = "all"
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false              # show dotfiles

[editor.indent-guides]
render = true
character = "┊"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.soft-wrap]
enable = true

[keys.normal]
# quick save/quit, matching muscle memory from everywhere else
C-s = ":w"
# clear search highlight
esc = ["collapse_selection", "keep_primary_selection"]
